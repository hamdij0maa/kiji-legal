<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Hopscaper</title><link rel="icon" href="icon.png"><link rel="stylesheet" href="style.css">
<script>
(function(){
  var have=['en', 'fr'];
  var asked=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"en"]);
  var lang="en";
  for(var j=0;j<asked.length;j++){var b=String(asked[j]||"").toLowerCase().split("-")[0];if(have.indexOf(b)>=0){lang=b;break;}}
  var doc=(location.hash||"").replace("#","");
  var docs=['support', 'privacy', 'legal-notice'];
  location.replace(lang+"/"+(docs.indexOf(doc)>=0?doc:"support")+".html");
})();
</script></head>
<body><main><h1>Hopscaper</h1><ul class="langs"><li><a href="en/support.html" lang="en">English</a></li><li><a href="fr/support.html" lang="fr">Français</a></li></ul></main></body></html>
