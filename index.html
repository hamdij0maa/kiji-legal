<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Kiji · Legal</title><link rel="stylesheet" href="style.css">
<script>
(function(){
  var have=['en', 'ar', 'de', 'es', 'fr', 'it', 'ja', 'ko', 'pt-BR', 'zh-Hans'];
  var asked=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"en"]);
  function pick(tag){
    tag=String(tag||"");var low=tag.toLowerCase();
    if(low.indexOf("zh")===0)return "zh-Hans";
    if(low.indexOf("pt")===0)return "pt-BR";
    var base=low.split("-")[0];
    for(var i=0;i<have.length;i++)if(have[i].toLowerCase()===base)return have[i];
    return null;
  }
  var lang="en";
  for(var j=0;j<asked.length;j++){var p=pick(asked[j]);if(p){lang=p;break;}}
  var doc=(location.hash||"").replace("#","");
  var docs=['privacy', 'terms', 'eula', 'legal-notice', 'support'];
  location.replace(lang+"/"+(docs.indexOf(doc)>=0?doc:"index")+".html");
})();
</script></head>
